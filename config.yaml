# Code-Aware RAG Configuration

project:
  name: "Code-Aware RAG"
  root_dir: "."
  data_dir: "./data"
  repo_dir: "./data/repositories"
  index_dir: "./data/indexes"

embedding:
  provider: "ollama"
  model: "nomic-embed-text"
  dimensions: 768
  batch_size: 8
  base_url: "http://localhost:11434"
llm:
  provider: "ollama"
  model: "llama3"                  # You can also use qwen2.5-coder, mistral, or codellama
  base_url: "http://localhost:11434"
  temperature: 0.2
  max_tokens: 2048

ast:
  languages:
    - "python"
    - "java"
    - "javascript"
    - "typescript"

server:
  host: "0.0.0.0"
  port: 8000

indexing:
  faiss:
    filename: "vector_index.faiss"
    metadata_filename: "metadata.json"

  bm25:
    filename: "bm25_index.pkl"
    metadata_filename: "bm25_metadata.json"
    